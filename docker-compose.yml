services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    hostname: ldap.example.com
    environment:
      LDAP_ORGANISATION: "${LDAP_ORGANISATION:-Example Corp}"
      LDAP_DOMAIN: "${LDAP_DOMAIN:-example.com}"
      LDAP_BASE_DN: "${LDAP_BASE_DN:-dc=example,dc=com}"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-adminpassword}"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    ports:
      - "${LDAP_PORT:-389}:389"
      - "${LDAPS_PORT:-636}:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost:389 -D \"cn=admin,$${LDAP_BASE_DN:-dc=example,dc=com}\" -w \"$${LDAP_ADMIN_PASSWORD:-adminpassword}\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ldap-network

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    hostname: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      # The image enables HTTPS by default. For this lab we intentionally
      # disable it so Apache serves phpLDAPadmin correctly on port 80.
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "${PHPLDAPADMIN_PORT:-8080}:80"
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - ldap-network

  api:
    build: ./fastapi
    container_name: ldap-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      LDAP_HOST: openldap
      LDAP_PORT: "389"
      LDAP_BASE_DN: "${LDAP_BASE_DN:-dc=example,dc=com}"
      LDAP_ADMIN_DN: "cn=admin,${LDAP_BASE_DN:-dc=example,dc=com}"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-adminpassword}"
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - ldap-network

volumes:
  ldap_data:
  ldap_config:

networks:
  ldap-network:
    driver: bridge
